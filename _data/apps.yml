# Uygulama kataloğu. Ad ve alt başlıklar fastlane/metadata'dan alınmıştır
# (her projenin fastlane/metadata/<dil>/name.txt ve subtitle.txt dosyaları).
# Gizlilik ve destek adresleri App Store'a girilmiş MEVCUT adreslerdir;
# o eski depolar silinirse App Store bağlantıları kırılır — önce ASC güncellenir.
#
# page: true  → sitede kendi sayfası var (/tr/<slug>/, /en/<slug>/)
# page: false → yalnız listede görünür, App Store bağlantısıyla
# guide: true → iki dilde kılavuz zorunlu (tr/<slug>/kilavuz.md, en/<slug>/guide.md)
# Yalnız App Store'da YAYINDA olan uygulamalar listelenir.

